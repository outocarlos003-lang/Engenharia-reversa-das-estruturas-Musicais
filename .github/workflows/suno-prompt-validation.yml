name: SUNO Prompt Validation

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate protocol file
        run: test -s SUNO_PROMPT_PROTOCOL.md
      - name: Accept a prompt within the limit
        run: node scripts/validate-suno-prompt.mjs 'Prompt de teste: piano, voz suave e crescendo cinematográfico.'
      - name: Reject a prompt above the limit
        shell: bash
        run: |
          prompt=$(node -e "process.stdout.write('x'.repeat(851))")
          if node scripts/validate-suno-prompt.mjs "$prompt"; then
            echo 'ERROR: validator accepted 851 characters.'
            exit 1
          fi
          echo 'OK: validator rejected 851 characters.'
