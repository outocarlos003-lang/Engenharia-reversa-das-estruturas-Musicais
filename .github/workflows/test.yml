name: Test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify SUNO protocol and reusable document are present
        run: |
          test -s SUNO_PROMPT_PROTOCOL.md
          test -s docs/modelo-documento-reutilizavel-suno.md
          test -s skills/reverse-engineer-musical-structure/SKILL.md
      - name: Prevent regression in mandatory reusable SUNO delivery
        run: |
          grep -qi "documento Markdown reutilizável" SUNO_PROMPT_PROTOCOL.md
          grep -qi "850 caracteres" SUNO_PROMPT_PROTOCOL.md
          grep -qi "documento reutilizável" skills/reverse-engineer-musical-structure/SKILL.md
          grep -qi "Prompt final para SUNO AI" docs/modelo-documento-reutilizavel-suno.md
      - name: Accept prompt within the 850-character limit
        run: node scripts/validate-suno-prompt.mjs "Prompt de teste: piano, voz suave e crescendo cinematográfico."
      - name: Reject prompt above the 850-character limit
        shell: bash
        run: |
          prompt=$(node -e "process.stdout.write('x'.repeat(851))")
          if node scripts/validate-suno-prompt.mjs "$prompt"; then
            echo "ERROR: 851-character prompt was accepted"
            exit 1
          fi
          echo "OK: 851-character prompt rejected"
      - run: node scripts/check-domain-boundary.mjs
      - run: npm test
      - run: npm run check
