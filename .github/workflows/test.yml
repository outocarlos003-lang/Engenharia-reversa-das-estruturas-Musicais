name: Test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-domain-boundary.mjs
      - run: npm test
      - run: npm run check

  suno-prompt-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm protocol exists
        run: test -s SUNO_PROMPT_PROTOCOL.md
      - name: Accept a prompt within 850 characters
        run: node scripts/validate-suno-prompt.mjs 'Prompt de teste: piano, voz suave e crescendo cinematográfico.'
      - name: Reject a prompt above 850 characters
        shell: bash
        run: |
          prompt=$(node -e "process.stdout.write('x'.repeat(851))")
          if node scripts/validate-suno-prompt.mjs "$prompt"; then
            echo 'ERROR: validator accepted 851 characters.'
            exit 1
          fi
          echo 'OK: validator rejected 851 characters.'
