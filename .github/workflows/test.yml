name: Test
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - 'SUNO_PROMPT_PROTOCOL.md'
      - 'scripts/validate-suno-prompt.mjs'
      - '.github/workflows/suno-prompt-validation.yml'
  pull_request:
    paths-ignore:
      - 'SUNO_PROMPT_PROTOCOL.md'
      - 'scripts/validate-suno-prompt.mjs'
      - '.github/workflows/suno-prompt-validation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-domain-boundary.mjs
      - run: npm test
      - run: npm run check
